<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>The Odin Project Calculator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Odin Project Calculator</h1>
    <div id="calculatorContainer">
      <input type="text" id="display" autocomplete="off"></input>
      <div id="rowTwo" class="row">
        <button id="acButton" class="calculatorButtons styling">AC</button>
        <button id="squarerootButton" class="calculatorButtons styling">%</button>
        <button id="percentButton" class="calculatorButtons operatorButtons styling">√x</button>
        <button id="backspaceButton" class="calculatorButtons styling">DEL</button>
      </div>
      <div id="rowThree" class="row">
        <button id="sevenButton" class="calculatorButtons digitButtons styling">7</button>
        <button id="eightButton" class="calculatorButtons digitButtons styling">8</button>
        <button id="nineButton" class="calculatorButtons digitButtons styling">9</button>
        <button id="divideButton" class="calculatorButtons operatorButtons styling">÷</button>
      </div>
      <div id="rowFour" class="row">
        <button id="fourButton" class="calculatorButtons digitButtons styling">4</button>
        <button id="fiveButton" class="calculatorButtons digitButtons styling">5</button>
        <button id="sixButton" class="calculatorButtons digitButtons styling">6</button>
        <button id="multiplyButton" class="calculatorButtons operatorButtons styling">X</button>
      </div>
      <div id="rowFive" class="row">
        <button id="oneButton" class="calculatorButtons digitButtons styling">1</button>
        <button id="twoButton" class="calculatorButtons digitButtons styling">2</button>
        <button id="threeButton" class="calculatorButtons digitButtons styling">3</button>
        <button id="subtractButton" class="calculatorButtons operatorButtons styling">-</button>
      </div>
      <div id="rowSix" class="row">
        <button id="zeroButton" class="calculatorButtons digitButtons styling">0</button>
        <button id="positiveNegativeButton" class="calculatorButtons styling">- / +</button>
        <button id="addButton" class="calculatorButtons operatorButtons styling">+</button>
      </div>
      <div id="rowSeven" class="row">
        <button id="piButton" class="calculatorButtons styling">π</button>
        <button id="decimalButton" class="calculatorButtons styling">.</button>
        <button id="equalsButton" class="calculatorButtons styling">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
